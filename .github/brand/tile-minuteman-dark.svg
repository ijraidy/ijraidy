<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 366" width="420" height="366" role="img" aria-label="Minuteman. Sits in your meeting and hands you the notes when it ends."><rect width="420" height="366" rx="18" fill="#0A0A0B"/><svg x="0" y="0" width="420" height="250" viewBox="0 0 420 250">
<defs></defs>
<style>
.pulse{transform-origin:center;transform-box:fill-box;
  animation:pulse 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.055s)}
@keyframes pulse{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.lift{animation:appear 2.6s ease-in-out infinite;animation-delay:calc(.4s + var(--i)*.22s)}
@keyframes appear{0%,10%{opacity:0}30%,88%{opacity:.75}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  [class] { animation: none !important; opacity: 1 !important; }
  .pen, .trace { stroke-dashoffset: 0 !important; }
  .rise, .lift, .beam, .bar, .pulse { transform: none !important; }
}
</style>
